# Unit tests for Thunderduck.Data, run on every push and pull request.
# No publishing and no secrets: releases are cut from Thunderduck's internal
# source, not from this mirror. The integration tests need a live API token and
# are deliberately not run here. See CONTRIBUTING.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET SDK
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 9.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test tests/Thunderduck.Data.Tests -c Release --no-build
